<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nissan Tiida 2005+ (Барашек)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(to bottom, #203a43, #2c5364);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
            color: #fff; padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px; padding: 25px 20px; max-width: 500px; width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            margin-top: 20px; margin-bottom: 20px;
        }
        h1 { text-align: center; margin-bottom: 5px; font-size: 1.3rem; letter-spacing: 0.5px; }
        .subtitle { text-align: center; opacity: 0.7; margin-bottom: 20px; font-size: 0.85rem; }

        /* Вкладки */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab {
            flex: 1; padding: 12px; border: none; border-radius: 12px;
            background: rgba(255,255,255,0.1); color: #9ba3af; cursor: pointer; 
            font-weight: 600; font-size: 0.95rem; transition: 0.3s;
        }
        .tab.active { 
            background: #4a90e2; color: white; 
            box-shadow: 0 4px 12px rgba(74,144,226,0.3); 
        }
        .mode-block { display: none; animation: fadeIn 0.3s; }
        .mode-block.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Стили для инпутов */
        .input-group { margin-bottom: 15px; }
        .input-label { 
            display: block; margin-bottom: 6px; font-size: 0.8rem; 
            color: #79a6d2; font-weight: 600; padding-left: 4px;
        }
        
        input[type="file"], input[type="text"] {
            width: 100%; padding: 14px; border-radius: 10px;
            border: none; background: rgba(255,255,255,0.1); color: #fff;
            font-size: 1rem; font-family: monospace; letter-spacing: 1px;
            outline: none; transition: 0.3s;
            border-left: 4px solid #4a90e2;
        }
        input[type="file"]:focus, input[type="text"]:focus { 
            background: rgba(255,255,255,0.15); box-shadow: 0 0 0 2px rgba(74,144,226,0.5); 
        }
        
        input[type="file"]::file-selector-button {
            background: #4a90e2; color: white; border: none; padding: 8px 12px;
            border-radius: 8px; margin-right: 10px; font-family: inherit; cursor: pointer;
        }

        /* Окна результатов (по дизайну со скриншота) */
        .result { display: none; margin-top: 25px; }
        
        .data-box { margin-bottom: 15px; }
        .data-box .label { 
            display: block; font-size: 0.8rem; color: #79a6d2; 
            font-weight: 600; margin-bottom: 6px; padding-left: 4px;
        }
        .data-box .value {
            background: #1d2d3d; /* Темный фон плашки */
            padding: 14px; border-radius: 10px;
            font-family: monospace; font-size: 1.1rem; letter-spacing: 1px;
            color: #ffffff; border-left: 4px solid #4a90e2;
            word-break: break-all;
        }

        /* Кнопка обработки ручного ввода */
        button.process-btn {
            width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #4a90e2, #357abd); color: white;
            font-size: 1rem; font-weight: 600; cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button.process-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(74,144,226,0.4); }
        button.process-btn:active { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Nissan Tiida 2005+ (Барашек)</h1>
        <div class="subtitle">Подготовка транспондера XT27 4D60 по дампу</div>

        <!-- Вкладки -->
        <div class="tabs">
            <button class="tab active" data-target="file-mode">Загрузка дампа</button>
            <button class="tab" data-target="manual-mode">Ручной ввод</button>
        </div>

        <!-- Режим загрузки файла -->
        <div id="file-mode" class="mode-block active">
            <div class="input-group">
                <label class="input-label">Загрузите дамп еепром (93C56 256 bytes) блока INTELLIGENT KEY</label>
                <input type="file" id="fileInput" accept=".bin">
            </div>
        </div>

        <!-- Режим ручного ввода -->
        <div id="manual-mode" class="mode-block">
            <div class="input-group">
                <label class="input-label">ID (3 байта, по смещению: 0x80)</label>
                <input type="text" id="manualId" placeholder="50 EB DE" maxlength="8">
            </div>
            <div class="input-group">
                <label class="input-label">Key (5 байт, по смещению: 0x84)</label>
                <input type="text" id="manualKey" placeholder="7F 3E DA 11 92" maxlength="14">
            </div>
            <button class="process-btn" id="manualProcessBtn">Обработать</button>
        </div>

        <!-- Блок результатов -->
        <div class="result" id="result">
            <div class="data-box">
                <span class="label">Password</span>
                <div class="value">A2</div>
            </div>
            
            <div class="data-box">
                <span class="label">User</span>
                <div class="value">00</div>
            </div>

            <div class="data-box">
                <span class="label">ID</span>
                <div class="value" id="idValue">--</div>
            </div>

            <div class="data-box">
                <span class="label">Key</span>
                <div class="value" id="keyValue">--</div>
            </div>

            <!-- Новое окно Transponder ID -->
            <div class="data-box">
                <span class="label">Transponder ID (Full)</span>
                <div class="value" id="fullIdValue" style="color: #4ade80;">--</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        const tabs = document.querySelectorAll('.tab');
        const fileInput = document.getElementById('fileInput');
        const manualProcessBtn = document.getElementById('manualProcessBtn');
        const manualId = document.getElementById('manualId');
        const manualKey = document.getElementById('manualKey');
        
        const resultDiv = document.getElementById('result');
        const idValue = document.getElementById('idValue');
        const keyValue = document.getElementById('keyValue');
        const fullIdValue = document.getElementById('fullIdValue');

        // Переключение вкладок
        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                tabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                document.querySelectorAll('.mode-block').forEach(block => block.classList.remove('active'));
                document.getElementById(this.getAttribute('data-target')).classList.add('active');
                
                // Скрываем результат при переключении
                resultDiv.style.display = 'none';
            });
        });

        // Функция форматирования массива байт в HEX строку
        function formatHex(bytes) {
            return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ').toUpperCase();
        }

        // Функция парсинга строки HEX в массив байт
        function parseHexString(str) {
            const cleanStr = str.replace(/[^0-9A-Fa-f]/g, '');
            if (cleanStr.length % 2 !== 0) return null; // Нечетное количество символов
            const result = [];
            for (let i = 0; i < cleanStr.length; i += 2) {
                result.push(parseInt(cleanStr.substr(i, 2), 16));
            }
            return result;
        }

        // Главная функция отображения и расчета
        function processAndRender(idBytes, keyBytes) {
            // idBytes и keyBytes - это исходные байты (как в дампе)
            
            // 1. Password (A2) и User (00) - фиксированные
            
            // 2. ID: реверс + байт 0A
            const idReversed = [...idBytes].reverse();
            const idWithEnd = [...idReversed, 0x0A];
            
            // 3. Key: реверс
            const keyReversed = [...keyBytes].reverse();

            // 4. Transponder ID: A2 + 00 + ID(с реверсом) + 0A
            const fullTransponder = [0xA2, 0x00, ...idWithEnd];

            // Отрисовка
            idValue.innerText = formatHex(idWithEnd);
            keyValue.innerText = formatHex(keyReversed);
            fullIdValue.innerText = formatHex(fullTransponder);

            resultDiv.style.display = 'block';
        }

        // Обработка файла
        fileInput.addEventListener('change', function() {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);

                if (data.length !== 256) {
                    alert('Ошибка: размер файла должен быть ровно 256 байт (93C56)!\nВаш файл: ' + data.length + ' байт.');
                    resultDiv.style.display = 'none';
                    fileInput.value = '';
                    tg.HapticFeedback.notificationOccurred('error');
                    return;
                }

                // Извлечение по смещениям
                const idRaw = data.slice(0x80, 0x83); // 3 байта
                const keyRaw = data.slice(0x84, 0x89); // 5 байт

                processAndRender(idRaw, keyRaw);
                tg.HapticFeedback.impactOccurred('success');
            };
            reader.readAsArrayBuffer(file);
        });

        // Обработка ручного ввода
        manualProcessBtn.addEventListener('click', function() {
            const idStr = manualId.value.trim();
            const keyStr = manualKey.value.trim();

            if (!idStr || !keyStr) {
                alert('Заполните оба поля (ID и Key)!');
                return;
            }

            const idBytes = parseHexString(idStr);
            const keyBytes = parseHexString(keyStr);

            if (!idBytes || idBytes.length !== 3) {
                alert('Ошибка: ID должен состоять ровно из 3 байт (6 символов HEX).');
                return;
            }

            if (!keyBytes || keyBytes.length !== 5) {
                alert('Ошибка: Key должен состоять ровно из 5 байт (10 символов HEX).');
                return;
            }

            processAndRender(idBytes, keyBytes);
            tg.HapticFeedback.impactOccurred('success');
        });
    </script>
</body>
</html>
