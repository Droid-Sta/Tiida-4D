<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nissan Tiida 2005+ (Барашек)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(to bottom, #203a43, #2c5364);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            color: #fff; padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px; padding: 30px; max-width: 500px; width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
        }
        h1 { text-align: center; margin-bottom: 10px; font-size: 1.4rem; letter-spacing: 1px; }
        .subtitle { text-align: center; opacity: 0.8; margin-bottom: 20px; font-size: 0.9rem; }

        label { display: block; margin-top: 15px; font-size: 0.9rem; opacity: 0.9; }

        input[type="file"] {
            width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px;
            border: none; background: rgba(255,255,255,0.15); color: #fff;
            font-size: 1rem; font-family: monospace; letter-spacing: 1px;
            outline: none; transition: 0.3s; cursor: pointer;
        }
        input[type="file"]:focus { background: rgba(255,255,255,0.25); box-shadow: 0 0 0 2px #4a90e2; }
        input[type="file"]::file-selector-button {
            background: #4a90e2; color: white; border: none; padding: 8px 12px;
            border-radius: 8px; margin-right: 10px; font-family: inherit; cursor: pointer;
        }

        .result {
            margin-top: 20px; padding: 20px; background: rgba(0,0,0,0.3);
            border-radius: 12px; display: none; word-break: break-all;
            text-align: center;
        }
        .result-item { margin-bottom: 15px; }
        .result-item:last-child { margin-bottom: 0; }
        .result-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 0.8rem; opacity: 0.7; letter-spacing: 0; margin-bottom: 5px; }
        .result-value { font-family: monospace; font-size: 1.2rem; letter-spacing: 2px; color: #ffffff; }

        .info { margin-top: 15px; font-size: 0.8rem; opacity: 0.7; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Nissan Tiida 2005+ (Барашек)</h1>
        <div class="subtitle">Подготовка транспондера XT27 4D60 по дампу</div>

        <label for="fileInput">Загрузите дамп еепром 93C56 (256 bytes)</label>
        <input type="file" id="fileInput" accept=".bin">

        <div class="result" id="result">
            <div class="result-item">
                <div class="result-label">Password</div>
                <div class="result-value">A2</div>
            </div>
            <div class="result-item">
                <div class="result-label">User</div>
                <div class="result-value">00</div>
            </div>
            <div class="result-item">
                <div class="result-label">ID</div>
                <div class="result-value" id="idValue"></div>
            </div>
            <div class="result-item">
                <div class="result-label">Key</div>
                <div class="result-value" id="keyValue"></div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        const fileInput = document.getElementById('fileInput');
        const resultDiv = document.getElementById('result');
        const idValue = document.getElementById('idValue');
        const keyValue = document.getElementById('keyValue');

        function hexToString(arr) {
            return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join(' ').toUpperCase();
        }

        fileInput.addEventListener('change', function() {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);

                // Проверка размера
                if (data.length !== 256) {
                    alert('Ошибка: размер файла должен быть ровно 256 байт (93C56)!\nВаш файл: ' + data.length + ' байт.');
                    resultDiv.style.display = 'none';
                    fileInput.value = '';
                    tg.HapticFeedback.notificationOccurred('error');
                    return;
                }

                // ID по смещению 0x80 (3 байта) с реверсом + 0A
                const idRaw = data.slice(0x80, 0x83);
                const idReversed = Array.from(idRaw).reverse();
                const idResult = [...idReversed, 0x0A];

                // Key по смещению 0x84 (5 байт) с реверсом
                const keyRaw = data.slice(0x84, 0x89);
                const keyResult = Array.from(keyRaw).reverse();

                idValue.innerText = hexToString(idResult);
                keyValue.innerText = hexToString(keyResult);

                resultDiv.style.display = 'block';
                tg.HapticFeedback.impactOccurred('success');
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
